[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run. The SQLAlchemy engine and its connection
# pool are session-scoped; a per-test loop leaves the pool holding sockets bound
# to a loop that has since closed, which surfaces as "Event loop is closed"
# during teardown rather than as a test failure.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
